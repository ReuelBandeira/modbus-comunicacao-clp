services:
  mongo:
    image: mongo:7.0
    container_name: pcm-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-pcm}
      # Lidas pelo script de init abaixo para criar o usuário de aplicação (não-root).
      MONGO_APP_DATABASE: ${MONGO_DATABASE:-pcm}
      MONGO_APP_USER: ${MONGO_USER:-pcm_app}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD:-pcm_app}
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - pcm_mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pcm_mongo_data:
