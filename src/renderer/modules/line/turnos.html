<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCM · Turnos</title>
    <link rel="stylesheet" href="../../vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/ihm.css">
    <link rel="stylesheet" href="line.css">
    <link rel="stylesheet" href="turnos.css">
    <script src="turnos.js" defer></script>
    <link rel="stylesheet" href="../../css/navigation.css">
    <script src="../../js/navigation.js" defer></script>
</head>
<body>
    <header class="top-bar">
        <h1 class="screen-title">PCM - CADASTRO DE TURNOS</h1>
        <div class="connection"><span id="connection-dot" class="dot"></span><span id="admin-status" role="status">Acesso ADMIN necessário</span></div>
    </header>
    <main class="shifts-main">
        <section id="login-panel" class="panel shifts-login">
            <div class="section-heading"><div><p class="eyebrow">ACESSO RESTRITO</p><h2>Autenticação ADMIN</h2></div></div>
            <p class="help">Somente o ADMIN pode cadastrar, editar ou remover turnos.</p>
            <form id="admin-login-form" class="shifts-form">
                <label for="admin-password">Senha ADMIN<input id="admin-password" type="password" maxlength="200" autocomplete="current-password" required autofocus></label>
                <div class="form-footer"><span></span><button id="admin-login" class="button primary" type="submit">Entrar</button></div>
            </form>
        </section>

        <section id="shifts-panel" class="shifts-layout" hidden>
            <section class="panel shift-editor">
                <div class="section-heading"><div><p class="eyebrow">CADASTRO</p><h2 id="editor-title">Novo turno</h2></div></div>
                <form id="shift-form" class="shifts-form">
                    <label for="shift-name">Nome<input id="shift-name" maxlength="100" autocomplete="off" required></label>
                    <div class="time-fields">
                        <label for="shift-start">Hora de início<input id="shift-start" type="time" required></label>
                        <label for="shift-end">Hora de fim<input id="shift-end" type="time" required></label>
                    </div>
                    <label class="status-field" for="shift-active"><input id="shift-active" type="checkbox" checked> Turno ativo</label>
                    <p class="help">Turnos podem atravessar a meia-noite. Horários ativos não podem se sobrepor.</p>
                    <div class="form-footer">
                        <button id="cancel-edit" class="button secondary" type="button" hidden>Cancelar edição</button>
                        <button id="save-shift" class="button success" type="submit">Cadastrar</button>
                    </div>
                </form>
            </section>

            <section class="panel shift-list-panel">
                <div class="section-heading"><div><p class="eyebrow">TURNOS</p><h2>Cadastros</h2></div><button id="admin-exit" class="button secondary compact-button" type="button">Sair do ADMIN</button></div>
                <div id="shift-message" class="notice" role="status" aria-live="polite" hidden></div>
                <div class="table-scroll"><table><thead><tr><th>Nome</th><th>Início</th><th>Fim</th><th>Status</th><th>Ações</th></tr></thead><tbody id="shift-list"></tbody></table></div>
            </section>
        </section>
    </main>
    <footer class="bottom-nav" data-navigation aria-label="Navegação principal"></footer>
</body>
</html>
